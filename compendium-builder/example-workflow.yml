# Vorlage für das PRIVATE Inhalte-Repo (nicht für dieses Modul-Repo!)
#
# Diese Datei nach `.github/workflows/build-packs.yml` in deinem privaten
# Git-Object-Sync-Inhalte-Repo kopieren. Baut zyklisch (Cron) sowie bei jedem
# Push die Kompendien neu und committed sie zurück in dasselbe Repo.

name: Build Compendium Packs

on:
  push:
    branches: [main]
  schedule:
    # Täglich um 03:15 UTC – Uhrzeit/Frequenz nach Bedarf anpassen.
    - cron: "15 3 * * *"
  workflow_dispatch: {} # erlaubt manuelles Auslösen über die Actions-Oberfläche

permissions:
  contents: write # nötig, damit der Workflow packs/ + module.json zurückcommitten darf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten installieren
        working-directory: compendium-builder
        run: npm install

      - name: Kompendien bauen
        working-directory: .
        run: node compendium-builder/build-packs.mjs

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packs module.json
          git diff --cached --quiet || git commit -m "Kompendien neu gebaut"
          git push
