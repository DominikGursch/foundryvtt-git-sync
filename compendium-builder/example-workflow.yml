# Template for the PRIVATE content repository (not this module repository).
#
# Copy this file to `.github/workflows/build-packs.yml` in your private
# Foundry Git Sync content repository. Rebuilds compendiums on a schedule (cron)
# and on every push, then commits them back to the same repository.

name: Build Compendium Packs

on:
  push:
    branches: [main]
  schedule:
    # Daily at 03:15 UTC; adjust the time/frequency as needed.
    - cron: "15 3 * * *"
  workflow_dispatch: {} # Allow manual runs from the Actions UI.

permissions:
  contents: write # Required to commit packs/ and module.json back to the repository.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten installieren
        working-directory: compendium-builder
        run: npm install

      - name: Build compendiums
        working-directory: .
        run: node compendium-builder/build-packs.mjs

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packs module.json
          git diff --cached --quiet || git commit -m "Rebuild compendiums"
          git push
